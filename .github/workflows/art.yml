name: art # zamanlayıcıyı yeniden kaydet
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock cheerio@1.0.0
      - name: haber beslemeleri → feeds.json (site önce bunu okur; hata art adımını durdurmaz)
        continue-on-error: true
        run: node .github/scripts/feeds.mjs out/feeds.json
      - run: node .github/scripts/art.mjs out/art.json
      - name: veri-art dalına yaz (site yeniden build olmaz)
        run: |
          cd out
          git init -q -b veri-art
          git config user.name "art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "art $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri-art
