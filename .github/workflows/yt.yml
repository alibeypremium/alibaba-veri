name: yt # zamanlayıcıyı yeniden kaydet
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yt
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/yt.mjs out/yt.json
      - name: veri-yt dalına yaz (site yeniden build olmaz)
        run: |
          cd out
          git init -q -b veri-yt
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add yt.json
          git commit -q -m "yt $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri-yt
      - name: X listesi (Nitter RSS) → veri-tw dalı
        continue-on-error: true   # Nitter çalışmazsa yt etkilenmez; veri-tw dalındaki eski tw.json kalır
        run: |
          node .github/scripts/tw.mjs out-tw/tw.json
          cd out-tw
          git init -q -b veri-tw
          git config user.name "tw-bot"
          git config user.email "tw-bot@users.noreply.github.com"
          git add tw.json
          git commit -q -m "tw $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri-tw
