name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock cheerio@1.0.0
      - run: |
          node -e "
          const cheerio=require('cheerio');
          (async()=>{
            for (const u of ['bosuna_tiklamayin_haber','sondakika_haberr0','ninjanewstr','firsattayfa']){
              const t=await (await fetch('https://t.me/s/'+u,{headers:{'user-agent':'Mozilla/5.0 (compatible; tg-feed)'}})).text();
              const \$=cheerio.load(t);
              let multi=0,vid=0,round=0,gifs=0,msgs=0;
              \$('.tgme_widget_message[data-post]').each((_,el)=>{msgs++;const m=\$(el);
                const ph=m.find('.tgme_widget_message_photo_wrap').length; if(ph>1){multi++; if(multi<2)console.log('MULTI',u,m.attr('data-post'),m.find('.tgme_widget_message_grouped_wrap').length, ph, m.html().slice(0,1500).replace(/\s+/g,' '))}
                if(m.find('video').length){vid++; if(vid<3)console.log('VIDEO',u,m.attr('data-post'),m.find('video').toArray().map(v=>cheerio.load('<x>')('x').append(v).html()).join('').slice(0,500))}
                if(m.find('.tgme_widget_message_roundvideo').length)round++;
                if(m.find('.tgme_widget_message_video_wrap, .message_video_play').length&&!m.find('video').length){ if(gifs++<2)console.log('VIDEO-NOSRC',u,m.attr('data-post'),m.find('.tgme_widget_message_video_wrap').html().slice(0,600).replace(/\s+/g,' '))}
              });
              console.log('SUM',u,'mesaj',msgs,'çoklu',multi,'video',vid,'yuvarlak',round,'videosuz-oynatıcı',gifs);
            }
          })()"
