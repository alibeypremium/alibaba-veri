name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e "
          (async()=>{
            for (const id of ['2122970568550998400','2122965974408479230']){
              const token=((Number(id)/1e15)*Math.PI).toString(36).replace(/(0+|\.)/g,'');
              for (const host of ['cdn.syndication.twimg.com','syndication.twitter.com']){
                try{
                  const r=await fetch('https://'+host+'/tweet-result?id='+id+'&lang=tr&token='+token,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(15000)});
                  const t=await r.text();
                  console.log('RES',host,id,r.status,r.headers.get('access-control-allow-origin'),t.length);
                  try{const j=JSON.parse(t);console.log('VID',JSON.stringify((j.mediaDetails||[]).map(m=>({type:m.type,v:m.video_info&&m.video_info.variants,d:m.video_info&&m.video_info.duration_millis}))).slice(0,1500))}catch(e){console.log('BODY',t.slice(0,300))}
                }catch(e){console.log('ERR',host,e.message)}
              }
            }
          })()"
