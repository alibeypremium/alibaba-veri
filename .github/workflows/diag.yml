name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for y in 2026 2027; do curl -sS -m 40 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o hw$y.html -w "$y %{http_code} %{size_download}\n" "https://orangetrackdiecast.com/$y-hot-wheels-master-list-of-all-lines/" || true; done
          git init -q -b diag-hw && git config user.name d && git config user.email d@users.noreply.github.com
          git add -A && git commit -q -m d && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-hw
